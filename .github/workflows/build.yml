name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear juego
        run: |
          mkdir -p app/src/main/java/com/misionreciclaje/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'MisionReciclaje'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.misionreciclaje.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.misionreciclaje.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Misión Reciclaje"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/misionreciclaje/app/MainActivity.java <<'EOF'
          package com.misionreciclaje.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              String[] objetos = {
                  "🍌 Cáscara de banano",
                  "🍎 Corazón de manzana",
                  "🍂 Hojas secas",
                  "🍚 Restos de comida",
                  "🧴 Botella plástica vacía y limpia",
                  "🥫 Lata de aluminio",
                  "🍶 Frasco de vidrio limpio",
                  "📦 Caja de cartón limpia",
                  "🍕 Caja de pizza manchada de grasa",
                  "🧻 Papel higiénico o servilleta usada",
                  "🍬 Envoltura metalizada de golosina",
                  "☕ Taza de cerámica rota"
              };

              String[] respuestas = {
                  "O",
                  "O",
                  "O",
                  "O",
                  "A",
                  "A",
                  "A",
                  "A",
                  "N",
                  "N",
                  "N",
                  "N"
              };

              String[] explicaciones = {
                  "La cáscara es de origen biológico y se descompone naturalmente.",
                  "Los restos de frutas son residuos orgánicos y pueden descomponerse.",
                  "Las hojas secas son materia vegetal biodegradable.",
                  "Los restos de comida son residuos orgánicos.",
                  "Una botella plástica limpia y vacía puede recuperarse para reciclaje.",
                  "El aluminio puede recuperarse y reciclarse muchas veces.",
                  "Un frasco de vidrio limpio puede ser aprovechado y reciclado.",
                  "El cartón limpio puede recuperarse para fabricar nuevo papel o cartón.",
                  "La grasa contamina el cartón y dificulta su reciclaje.",
                  "El papel higiénico o la servilleta usada está contaminada y no debe reciclarse con papel limpio.",
                  "Las envolturas metalizadas suelen combinar varias capas de materiales y no se reciclan con los plásticos comunes.",
                  "La cerámica no es vidrio y no debe mezclarse con los envases de vidrio reciclables."
              };

              String[] nombresCategorias = {
                  "Orgánico",
                  "Inorgánico aprovechable",
                  "Inorgánico no aprovechable"
              };

              String[] codigos = {
                  "O",
                  "A",
                  "N"
              };

              int ronda = 0;
              int puntos = 0;
              boolean bloqueado = false;

              TextView progreso;
              TextView marcador;
              TextView temporizador;
              TextView objeto;
              TextView mensaje;

              Button[] botones = new Button[3];

              CountDownTimer reloj;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);

                  LinearLayout principal = new LinearLayout(this);
                  principal.setOrientation(LinearLayout.VERTICAL);
                  principal.setGravity(Gravity.CENTER_HORIZONTAL);
                  principal.setPadding(34, 42, 34, 40);
                  principal.setBackgroundColor(Color.rgb(230, 246, 228));

                  TextView titulo = crearTexto("🌎 MISIÓN RECICLAJE", 27);
                  titulo.setTypeface(null, Typeface.BOLD);
                  principal.addView(titulo);

                  progreso = crearTexto("Pregunta 1 de 12", 17);
                  progreso.setPadding(0, 20, 0, 5);
                  principal.addView(progreso);

                  marcador = crearTexto("Puntos: 0", 21);
                  marcador.setTypeface(null, Typeface.BOLD);
                  principal.addView(marcador);

                  temporizador = crearTexto("⏱ 5 segundos", 25);
                  temporizador.setTypeface(null, Typeface.BOLD);
                  temporizador.setTextColor(Color.rgb(190, 40, 35));
                  temporizador.setPadding(0, 18, 0, 18);
                  principal.addView(temporizador);

                  TextView instruccion = crearTexto(
                      "Clasifica el residuo antes de que termine el tiempo",
                      17
                  );
                  principal.addView(instruccion);

                  objeto = crearTexto("", 29);
                  objeto.setTypeface(null, Typeface.BOLD);
                  objeto.setGravity(Gravity.CENTER);
                  objeto.setPadding(10, 55, 10, 45);
                  principal.addView(objeto);

                  mensaje = crearTexto("¿Dónde debe ir?", 18);
                  mensaje.setGravity(Gravity.CENTER);
                  mensaje.setPadding(10, 0, 10, 28);
                  principal.addView(mensaje);

                  botones[0] = crearBoton(
                      "🌱 Orgánico",
                      Color.rgb(46, 125, 50),
                      0
                  );

                  botones[1] = crearBoton(
                      "♻️ Inorgánico\naprovechable",
                      Color.rgb(30, 105, 185),
                      1
                  );

                  botones[2] = crearBoton(
                      "🗑️ Inorgánico\nno aprovechable",
                      Color.rgb(105, 80, 65),
                      2
                  );

                  principal.addView(botones[0]);
                  principal.addView(botones[1]);
                  principal.addView(botones[2]);

                  scroll.addView(principal);
                  setContentView(scroll);

                  mostrarPregunta();
              }

              Button crearBoton(String texto, int color, int indice) {

                  Button boton = new Button(this);

                  boton.setText(texto);
                  boton.setTextSize(18);
                  boton.setTextColor(Color.WHITE);
                  boton.setAllCaps(false);
                  boton.setGravity(Gravity.CENTER);
                  boton.setBackgroundColor(color);
                  boton.setTag(indice);
                  boton.setMinHeight(115);

                  LinearLayout.LayoutParams parametros =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );

                  parametros.setMargins(0, 7, 0, 7);
                  boton.setLayoutParams(parametros);

                  boton.setOnClickListener(v -> {
                      int numero = (Integer) v.getTag();
                      responder(numero);
                  });

                  return boton;
              }

              TextView crearTexto(String texto, int tamano) {

                  TextView vista = new TextView(this);

                  vista.setText(texto);
                  vista.setTextSize(tamano);
                  vista.setTextColor(Color.rgb(28, 76, 44));
                  vista.setGravity(Gravity.CENTER);

                  return vista;
              }

              void mostrarPregunta() {

                  bloqueado = false;

                  progreso.setText(
                      "Pregunta " + (ronda + 1) + " de " + objetos.length
                  );

                  marcador.setText("Puntos: " + puntos);

                  objeto.setText(objetos[ronda]);

                  mensaje.setText("¿Dónde debe ir?");
                  mensaje.setTextColor(Color.rgb(28, 76, 44));

                  iniciarTemporizador();
              }

              void iniciarTemporizador() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  temporizador.setText("⏱ 5 segundos");
                  temporizador.setTextColor(Color.rgb(190, 40, 35));

                  reloj = new CountDownTimer(5000, 1000) {

                      @Override
                      public void onTick(long millisUntilFinished) {

                          long segundos =
                              Math.max(
                                  1,
                                  (millisUntilFinished + 999) / 1000
                              );

                          temporizador.setText(
                              "⏱ " + segundos + " segundos"
                          );
                      }

                      @Override
                      public void onFinish() {

                          if (bloqueado) return;

                          bloqueado = true;

                          puntos = Math.max(0, puntos - 5);

                          marcador.setText(
                              "Puntos: " + puntos
                          );

                          temporizador.setText("⏱ 0 segundos");

                          mensaje.setText(
                              "⌛ Tiempo agotado: -5 puntos\n" +
                              "Respuesta: " +
                              nombreRespuestaCorrecta()
                          );

                          mensaje.setTextColor(
                              Color.rgb(185, 40, 35)
                          );

                          avanzarDespuesDePausa();
                      }
                  };

                  reloj.start();
              }

              void responder(int numero) {

                  if (bloqueado) return;

                  if (
                      codigos[numero]
                          .equals(respuestas[ronda])
                  ) {

                      bloqueado = true;

                      if (reloj != null) {
                          reloj.cancel();
                      }

                      puntos += 10;

                      marcador.setText(
                          "Puntos: " + puntos
                      );

                      mensaje.setText(
                          "✅ ¡Correcto! +10 puntos"
                      );

                      mensaje.setTextColor(
                          Color.rgb(30, 125, 45)
                      );

                      avanzarDespuesDePausa();

                  } else {

                      puntos = Math.max(
                          0,
                          puntos - 5
                      );

                      marcador.setText(
                          "Puntos: " + puntos
                      );

                      mensaje.setText(
                          "❌ -5 puntos\n" +
                          explicaciones[ronda]
                      );

                      mensaje.setTextColor(
                          Color.rgb(185, 40, 35)
                      );
                  }
              }

              String nombreRespuestaCorrecta() {

                  String codigo =
                      respuestas[ronda];

                  if (codigo.equals("O")) {
                      return nombresCategorias[0];
                  }

                  if (codigo.equals("A")) {
                      return nombresCategorias[1];
                  }

                  return nombresCategorias[2];
              }

              void avanzarDespuesDePausa() {

                  new Handler(
                      getMainLooper()
                  ).postDelayed(() -> {

                      ronda++;

                      if (
                          ronda < objetos.length
                      ) {

                          mostrarPregunta();

                      } else {

                          terminarJuego();
                      }

                  }, 1200);
              }

              void terminarJuego() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  progreso.setText(
                      "12 de 12 completadas"
                  );

                  temporizador.setText("🏁");

                  objeto.setText(
                      "🏅 MISIÓN COMPLETADA"
                  );

                  String rango;

                  if (puntos >= 100) {

                      rango =
                          "🌟 Guardián del planeta";

                  } else if (puntos >= 70) {

                      rango =
                          "♻️ Buen reciclador";

                  } else {

                      rango =
                          "🌱 Sigue practicando";
                  }

                  mensaje.setText(
                      "Puntaje final: " +
                      puntos +
                      " de 120\n\n" +
                      rango
                  );

                  mensaje.setTextColor(
                      Color.rgb(30, 115, 45)
                  );

                  botones[0].setText(
                      "🔄 Jugar otra vez"
                  );

                  botones[1].setVisibility(
                      View.GONE
                  );

                  botones[2].setVisibility(
                      View.GONE
                  );

                  bloqueado = false;
              }

              void reiniciar() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  ronda = 0;
                  puntos = 0;
                  bloqueado = false;

                  botones[0].setText(
                      "🌱 Orgánico"
                  );

                  botones[1].setVisibility(
                      View.VISIBLE
                  );

                  botones[2].setVisibility(
                      View.VISIBLE
                  );

                  mostrarPregunta();
              }

              @Override
              protected void onDestroy() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisionReciclaje-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
