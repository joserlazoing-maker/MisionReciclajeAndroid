name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear juego
        run: |
          mkdir -p app/src/main/java/com/misionreciclaje/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'MisionReciclaje'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.misionreciclaje.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.misionreciclaje.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Misión Reciclaje"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/misionreciclaje/app/MainActivity.java <<'EOF'
          package com.misionreciclaje.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              String[] objetos = {
                  "🍌 Cáscara de banano",
                  "🧴 Botella plástica",
                  "📦 Cartón limpio",
                  "🍕 Caja de pizza grasosa",
                  "🍂 Hojas secas",
                  "🍬 Envoltura metalizada",
                  "🥫 Lata de aluminio",
                  "🍚 Restos de comida",
                  "☕ Cerámica rota",
                  "🍎 Restos de manzana",
                  "🍶 Frasco de vidrio",
                  "🧻 Servilleta usada"
              };

              String[] respuestas = {
                  "O",
                  "A",
                  "A",
                  "N",
                  "O",
                  "N",
                  "A",
                  "O",
                  "N",
                  "O",
                  "A",
                  "N"
              };

              String[] explicaciones = {
                  "La cáscara es biodegradable y pertenece a los residuos orgánicos.",
                  "Una botella plástica limpia puede recuperarse para reciclaje.",
                  "El cartón limpio puede recuperarse y reciclarse.",
                  "La grasa contamina el cartón y dificulta su reciclaje.",
                  "Las hojas son materia vegetal biodegradable.",
                  "Las envolturas metalizadas mezclan materiales y no se reciclan con los plásticos comunes.",
                  "El aluminio puede recuperarse y reciclarse muchas veces.",
                  "Los restos de comida son residuos orgánicos.",
                  "La cerámica no debe mezclarse con el vidrio reciclable.",
                  "Los restos de fruta son residuos orgánicos.",
                  "El vidrio limpio puede recuperarse y reciclarse.",
                  "Una servilleta usada está contaminada y no se recicla con papel limpio."
              };

              String[] categorias = {
                  "Orgánico",
                  "Inorgánico aprovechable",
                  "Inorgánico no aprovechable"
              };

              String[] codigos = {
                  "O",
                  "A",
                  "N"
              };

              int ronda = 0;
              int puntos = 0;
              boolean bloqueado = false;

              ScrollView scroll;
              LinearLayout principal;

              TextView progreso;
              TextView marcador;
              TextView temporizador;
              TextView objeto;
              TextView mensaje;

              Button[] botones = new Button[3];

              CountDownTimer reloj;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  scroll = new ScrollView(this);

                  principal = new LinearLayout(this);

                  principal.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  principal.setGravity(
                      Gravity.CENTER_HORIZONTAL
                  );

                  principal.setPadding(
                      34,
                      38,
                      34,
                      40
                  );

                  principal.setBackgroundColor(
                      Color.rgb(
                          230,
                          246,
                          228
                      )
                  );

                  scroll.addView(principal);

                  setContentView(scroll);

                  mostrarInicio();
              }

              void mostrarInicio() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  ronda = 0;
                  puntos = 0;
                  bloqueado = false;

                  principal.removeAllViews();

                  TextView titulo =
                      crearTexto(
                          "🌎 MISIÓN RECICLAJE",
                          29
                      );

                  titulo.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  titulo.setPadding(
                      0,
                      20,
                      0,
                      18
                  );

                  principal.addView(titulo);


                  TextView descripcion =
                      crearTexto(
                          "Clasifica correctamente 12 residuos y conviértete en Guardián del Planeta.",
                          18
                      );

                  descripcion.setPadding(
                      10,
                      0,
                      10,
                      30
                  );

                  principal.addView(descripcion);


                  TextView comoJugar =
                      crearTexto(
                          "¿CÓMO JUGAR?",
                          21
                      );

                  comoJugar.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  comoJugar.setPadding(
                      0,
                      10,
                      0,
                      20
                  );

                  principal.addView(comoJugar);


                  TextView organico =
                      crearTexto(
                          "🌱 ORGÁNICO\nRestos biodegradables de origen vegetal o alimenticio.",
                          17
                      );

                  organico.setPadding(
                      15,
                      12,
                      15,
                      18
                  );

                  principal.addView(organico);


                  TextView aprovechable =
                      crearTexto(
                          "♻️ INORGÁNICO APROVECHABLE\nMateriales que pueden recuperarse o reciclarse.",
                          17
                      );

                  aprovechable.setPadding(
                      15,
                      12,
                      15,
                      18
                  );

                  principal.addView(aprovechable);


                  TextView noAprovechable =
                      crearTexto(
                          "🗑️ INORGÁNICO NO APROVECHABLE\nResiduos contaminados o que normalmente no pueden recuperarse.",
                          17
                      );

                  noAprovechable.setPadding(
                      15,
                      12,
                      15,
                      26
                  );

                  principal.addView(noAprovechable);


                  TextView reglas =
                      crearTexto(
                          "⏱️ 10 segundos por pregunta\n\n" +
                          "✅ Respuesta correcta: +10 puntos\n\n" +
                          "❌ Respuesta incorrecta: -5 puntos\n\n" +
                          "⌛ Tiempo agotado: -5 puntos",
                          17
                      );

                  reglas.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  reglas.setPadding(
                      10,
                      10,
                      10,
                      28
                  );

                  principal.addView(reglas);


                  Button iniciar =
                      new Button(this);

                  iniciar.setText(
                      "▶  INICIAR MISIÓN"
                  );

                  iniciar.setTextSize(
                      20
                  );

                  iniciar.setTextColor(
                      Color.WHITE
                  );

                  iniciar.setAllCaps(
                      false
                  );

                  iniciar.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  iniciar.setBackgroundColor(
                      Color.rgb(
                          35,
                          115,
                          55
                      )
                  );

                  iniciar.setMinHeight(
                      120
                  );


                  LinearLayout.LayoutParams parametros =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );

                  parametros.setMargins(
                      0,
                      15,
                      0,
                      20
                  );

                  iniciar.setLayoutParams(
                      parametros
                  );


                  iniciar.setOnClickListener(
                      v -> iniciarJuego()
                  );

                  principal.addView(iniciar);
              }


              void iniciarJuego() {

                  ronda = 0;
                  puntos = 0;
                  bloqueado = false;

                  construirPantallaJuego();

                  mostrarPregunta();
              }


              void construirPantallaJuego() {

                  principal.removeAllViews();


                  TextView titulo =
                      crearTexto(
                          "🌎 MISIÓN RECICLAJE",
                          26
                      );

                  titulo.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  principal.addView(titulo);


                  progreso =
                      crearTexto(
                          "Pregunta 1 de 12",
                          16
                      );

                  progreso.setPadding(
                      0,
                      16,
                      0,
                      2
                  );

                  principal.addView(progreso);


                  marcador =
                      crearTexto(
                          "Puntos: 0",
                          20
                      );

                  marcador.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  principal.addView(marcador);


                  temporizador =
                      crearTexto(
                          "⏱ 10 segundos",
                          24
                      );

                  temporizador.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  temporizador.setTextColor(
                      Color.rgb(
                          185,
                          40,
                          35
                      )
                  );

                  temporizador.setPadding(
                      0,
                      15,
                      0,
                      15
                  );

                  principal.addView(
                      temporizador
                  );


                  TextView instruccion =
                      crearTexto(
                          "Clasifica el residuo antes de que termine el tiempo",
                          16
                      );

                  principal.addView(
                      instruccion
                  );


                  objeto =
                      crearTexto(
                          "",
                          24
                      );

                  objeto.setTypeface(
                      null,
                      Typeface.BOLD
                  );

                  objeto.setPadding(
                      8,
                      42,
                      8,
                      32
                  );

                  principal.addView(
                      objeto
                  );


                  mensaje =
                      crearTexto(
                          "¿Dónde debe ir?",
                          17
                      );

                  mensaje.setPadding(
                      8,
                      0,
                      8,
                      20
                  );

                  principal.addView(
                      mensaje
                  );


                  botones[0] =
                      crearBoton(
                          "🌱 Orgánico",
                          Color.rgb(
                              46,
                              125,
                              50
                          ),
                          0
                      );


                  botones[1] =
                      crearBoton(
                          "♻️ Inorgánico aprovechable",
                          Color.rgb(
                              30,
                              105,
                              185
                          ),
                          1
                      );


                  botones[2] =
                      crearBoton(
                          "🗑️ Inorgánico no aprovechable",
                          Color.rgb(
                              105,
                              80,
                              65
                          ),
                          2
                      );


                  principal.addView(
                      botones[0]
                  );

                  principal.addView(
                      botones[1]
                  );

                  principal.addView(
                      botones[2]
                  );
              }


              Button crearBoton(
                  String texto,
                  int color,
                  int indice
              ) {

                  Button boton =
                      new Button(this);

                  boton.setText(texto);

                  boton.setTextSize(17);

                  boton.setTextColor(
                      Color.WHITE
                  );

                  boton.setAllCaps(false);

                  boton.setGravity(
                      Gravity.CENTER
                  );

                  boton.setBackgroundColor(
                      color
                  );

                  boton.setTag(indice);

                  boton.setMinHeight(105);


                  LinearLayout.LayoutParams parametros =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );

                  parametros.setMargins(
                      0,
                      6,
                      0,
                      6
                  );

                  boton.setLayoutParams(
                      parametros
                  );


                  boton.setOnClickListener(
                      v -> {

                          int numero =
                              (Integer)
                              v.getTag();

                          responder(
                              numero
                          );
                      }
                  );

                  return boton;
              }


              TextView crearTexto(
                  String texto,
                  int tamano
              ) {

                  TextView vista =
                      new TextView(this);

                  vista.setText(texto);

                  vista.setTextSize(
                      tamano
                  );

                  vista.setTextColor(
                      Color.rgb(
                          28,
                          76,
                          44
                      )
                  );

                  vista.setGravity(
                      Gravity.CENTER
                  );

                  return vista;
              }


              void mostrarPregunta() {

                  bloqueado = false;

                  progreso.setText(
                      "Pregunta " +
                      (ronda + 1) +
                      " de " +
                      objetos.length
                  );

                  marcador.setText(
                      "Puntos: " +
                      puntos
                  );

                  objeto.setText(
                      objetos[ronda]
                  );

                  mensaje.setText(
                      "¿Dónde debe ir?"
                  );

                  mensaje.setTextColor(
                      Color.rgb(
                          28,
                          76,
                          44
                      )
                  );

                  iniciarTemporizador();
              }


              void iniciarTemporizador() {

                  if (reloj != null) {
                      reloj.cancel();
                  }


                  temporizador.setText(
                      "⏱ 10 segundos"
                  );


                  reloj =
                      new CountDownTimer(
                          10000,
                          1000
                      ) {

                          @Override
                          public void onTick(
                              long millisUntilFinished
                          ) {

                              long segundos =
                                  Math.max(
                                      1,
                                      (
                                          millisUntilFinished
                                          + 999
                                      ) / 1000
                                  );

                              temporizador.setText(
                                  "⏱ " +
                                  segundos +
                                  " segundos"
                              );
                          }


                          @Override
                          public void onFinish() {

                              if (bloqueado) {
                                  return;
                              }

                              bloqueado = true;

                              puntos =
                                  Math.max(
                                      0,
                                      puntos - 5
                                  );

                              marcador.setText(
                                  "Puntos: " +
                                  puntos
                              );

                              temporizador.setText(
                                  "⏱ 0 segundos"
                              );

                              mensaje.setText(
                                  "⌛ Tiempo agotado: -5 puntos\n" +
                                  "Respuesta correcta: " +
                                  respuestaCorrecta()
                              );

                              mensaje.setTextColor(
                                  Color.rgb(
                                      185,
                                      40,
                                      35
                                  )
                              );

                              avanzar();
                          }
                      };


                  reloj.start();
              }


              void responder(int numero) {

                  if (bloqueado) {
                      return;
                  }


                  if (
                      codigos[numero]
                          .equals(
                              respuestas[ronda]
                          )
                  ) {

                      bloqueado = true;


                      if (reloj != null) {
                          reloj.cancel();
                      }


                      puntos += 10;


                      marcador.setText(
                          "Puntos: " +
                          puntos
                      );


                      mensaje.setText(
                          "✅ ¡Correcto! +10 puntos"
                      );


                      mensaje.setTextColor(
                          Color.rgb(
                              30,
                              125,
                              45
                          )
                      );


                      avanzar();

                  } else {


                      puntos =
                          Math.max(
                              0,
                              puntos - 5
                          );


                      marcador.setText(
                          "Puntos: " +
                          puntos
                      );


                      mensaje.setText(
                          "❌ -5 puntos\n" +
                          explicaciones[ronda]
                      );


                      mensaje.setTextColor(
                          Color.rgb(
                              185,
                              40,
                              35
                          )
                      );
                  }
              }


              String respuestaCorrecta() {

                  String codigo =
                      respuestas[ronda];


                  if (codigo.equals("O")) {
                      return categorias[0];
                  }


                  if (codigo.equals("A")) {
                      return categorias[1];
                  }


                  return categorias[2];
              }


              void avanzar() {

                  new Handler(
                      getMainLooper()
                  ).postDelayed(
                      () -> {

                          ronda++;

                          if (
                              ronda <
                              objetos.length
                          ) {

                              mostrarPregunta();

                          } else {

                              terminarJuego();
                          }

                      },
                      1200
                  );
              }


              void terminarJuego() {

                  if (reloj != null) {
                      reloj.cancel();
                  }


                  progreso.setText(
                      "12 de 12 completadas"
                  );


                  temporizador.setText(
                      "🏁"
                  );


                  objeto.setText(
                      "🏅 MISIÓN COMPLETADA"
                  );


                  String rango;


                  if (puntos >= 100) {

                      rango =
                          "🌟 Guardián del planeta";

                  } else if (
                      puntos >= 70
                  ) {

                      rango =
                          "♻️ Buen reciclador";

                  } else {

                      rango =
                          "🌱 Sigue practicando";
                  }


                  mensaje.setText(
                      "Puntaje final: " +
                      puntos +
                      " de 120\n\n" +
                      rango
                  );


                  mensaje.setTextColor(
                      Color.rgb(
                          30,
                          115,
                          45
                      )
                  );


                  botones[0].setText(
                      "🏠 Volver al inicio"
                  );


                  botones[0].setOnClickListener(
                      v -> mostrarInicio()
                  );


                  botones[1].setVisibility(
                      View.GONE
                  );


                  botones[2].setVisibility(
                      View.GONE
                  );
              }


              @Override
              protected void onDestroy() {

                  if (reloj != null) {
                      reloj.cancel();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MisionReciclaje-APK-v4
          path: app/build/outputs/apk/debug/app-debug.apk
